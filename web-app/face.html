<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Granite Ghost — Face</title>
  <style>
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* hide the system cursor in kiosk mode */
      cursor: none;
      /* Screen is mounted upside-down — rotate everything 180° so the
         ghost appears right-side up to the viewer. Flip back by removing
         this rule if the screen orientation ever changes. */
      transform: rotate(180deg);
    }

    /* Size by height so the ghost fills the 5.5" screen vertically.
       On 1920x1080: svg = ~540x1080, ghost at scale 1.0 takes up the height. */
    svg {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      display: block;
    }

    /* ── Ghost scale (the big idle↔speaking transition) ─────────────────────
       1.2s ease handles both grow and shrink as a CSS interpolation, so
       there are no separate grow/shrink states in the state machine — the
       transition IS the grow/shrink animation. */
    #ghost-wrapper {
      transform-origin: 170px 205px;
      transform: scale(0.59);
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.speaking #ghost-wrapper { transform: scale(1.0); }

    /* ── Float (slow when idle, faster when speaking) ──────────────────── */
    #float-group {
      animation: float 4s ease-in-out infinite;
    }
    body.speaking #float-group {
      animation-duration: 3s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }

    /* ── Mouth: smile = idle, animated open = speaking ─────────────────── */
    .mouth-smile {
      opacity: 1;
      transition: opacity 0.4s ease;
      transition-delay: 0.3s; /* fade in late so shrink finishes first */
    }
    .mouth-open {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.speaking .mouth-smile {
      opacity: 0;
      transition-delay: 0s;
    }
    body.speaking .mouth-open {
      opacity: 1;
      transition-delay: 0.3s; /* fade in once the grow is well underway */
    }

    /* ── Speech sparkles around the ghost — only during speaking ──────── */
    .speech-sparkles {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    body.speaking .speech-sparkles {
      opacity: 1;
      transition-delay: 0.4s;
    }

    /* A tiny "loading" hint while we can't reach the API */
    #conn-warn {
      position: fixed;
      top: 8px;
      right: 8px;
      color: #ff99ff;
      font: 11px/1.4 system-ui, sans-serif;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    body.offline #conn-warn { opacity: 0.6; }
  </style>
</head>

<div id="conn-warn">backend offline</div>

<script>
// Poll the API for state changes.
// Same-origin so /api/face/state hits whichever host serves this page.
const POLL_MS = 200;
let last = null;
let failStreak = 0;

async function tick() {
  try {
    const r = await fetch('/api/face/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('bad status');
    const { state } = await r.json();
    failStreak = 0;
    document.body.classList.remove('offline');
    if (state !== last) {
      document.body.classList.toggle('speaking', state === 'speaking');
      last = state;
    }
  } catch (e) {
    failStreak++;
    if (failStreak > 10) document.body.classList.add('offline');
  } finally {
    setTimeout(tick, POLL_MS);
  }
}
tick();

// Manual toggle for testing without backend: press SPACE to flip state
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    document.body.classList.toggle('speaking');
    last = document.body.classList.contains('speaking') ? 'speaking' : 'idle';
    e.preventDefault();
  }
});
</script>
